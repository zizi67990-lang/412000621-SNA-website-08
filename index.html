<link rel="stylesheet" href="assets/style.css">

<body>
<header><h1>SNA Network Explorer</h1><span>王于榛（412000621）</span></header>
<main>
  <div class="intro"><h2>我的網絡</h2>
  <p>無向網絡 · 15 個節點 · 20 條邊</p></div>
  <div class="workspace">
    <aside class="controls">
      <h3>顯示設定</h3>
      <label for="metric-select">中心性指標</label>
      <select id="metric-select">
        <option value="degree">Degree Centrality</option>
        <option value="betweenness">Betweenness Centrality</option>
        <option value="eigenvector">Eigenvector Centrality</option>
      </select>
      <p class="help">切換指標後，節點大小依分數重新調整。</p>
      <div class="divider"></div>
      <div class="legend"><span class="dot-small"></span>低分數 <span class="dot-large"></span>高分數</div>
      <p class="help">在右邊拖曳節點、滾輪縮放。節點位置在切換指標時保持不變。</p>
      <div id="selected-info" class="selected-info" aria-live="polite">點選節點可以查看其分數。</div>
    </aside>
    <section class="network-card">
      <div class="network-header"><strong id="metric-title">Degree Centrality</strong><span>Interactive Network</span></div>
      <div id="network" role="img" aria-label="互動式網絡圖"></div>
    </section>
  </div>
</main>
